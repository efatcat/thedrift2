<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drift City</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
        canvas { display: block; }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.65);
            padding: 14px 18px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: none;
        }
        #info h1 { font-size: 16px; margin-bottom: 6px; color: #FF5252; }
        #info kbd {
            background: rgba(255,255,255,0.2);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        
        #speedometer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 170px;
            height: 170px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            border: 3px solid #FF5252;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 82, 82, 0.4);
        }
        #speed-value { font-size: 42px; font-weight: bold; color: #FF5252; line-height: 1; }
        #speed-unit { font-size: 12px; color: #aaa; margin-top: 3px; }
        
        #gear {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            backdrop-filter: blur(10px);
            border: 2px solid #FF5252;
            min-width: 65px;
            text-align: center;
        }
        
        #drift-score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 12px 22px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 2px solid #FFEB3B;
            text-align: right;
            min-width: 150px;
        }
        #drift-score .label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }
        #drift-score .value { font-size: 28px; font-weight: bold; color: #FFEB3B; }
        
        #drift-combo {
            position: absolute;
            top: 100px;
            right: 20px;
            color: #FF9800;
            background: rgba(0,0,0,0.7);
            padding: 6px 18px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #drift-combo.active { opacity: 1; }
        
        #garage {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 5, 15, 0.92);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.4s;
        }
        #garage.hidden { opacity: 0; pointer-events: none; }
        
        #garage h2 {
            color: white;
            font-size: 42px;
            margin-bottom: 8px;
            letter-spacing: 8px;
            font-weight: 900;
            background: linear-gradient(90deg, #FF1744, #FFEB3B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #garage-subtitle {
            color: #888;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        
        #car-list {
            display: flex;
            gap: 25px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1100px;
        }
        
        .car-card {
            width: 200px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
        }
        .car-card:hover {
            border-color: #FF5252;
            transform: translateY(-8px);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 15px 40px rgba(255, 82, 82, 0.3);
        }
        .car-card.selected {
            border-color: #FFEB3B;
            background: rgba(255, 235, 59, 0.1);
            box-shadow: 0 0 30px rgba(255, 235, 59, 0.4);
        }
        
        .car-preview {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        
        .car-card h3 { color: white; font-size: 15px; margin-bottom: 6px; }
        .car-card .car-stats { color: #888; font-size: 11px; line-height: 1.6; }
        .car-card .car-stats span { color: #FFEB3B; }
        
        #start-btn {
            padding: 18px 60px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 4px;
            color: white;
            background: linear-gradient(135deg, #FF1744, #FF5252);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 30px rgba(255, 23, 68, 0.5);
            text-transform: uppercase;
        }
        #start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 23, 68, 0.7);
        }
        
        #garage-btn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            z-index: 100;
        }
        #garage-btn:hover { border-color: #FF5252; color: #FF5252; }
    </style>
</head>
<body>
    <div id="garage">
        <h2>ГАРАЖ</h2>
        <div id="garage-subtitle">Выберите автомобиль</div>
        <div id="car-list"></div>
        <button id="start-btn">ПОЕХАЛИ</button>
    </div>
    
    <button id="garage-btn">ГАРАЖ</button>
    
    <div id="info">
        <h1>🏎️ DRIFT CITY</h1>
        <div><kbd>W</kbd>/<kbd>↑</kbd> газ &nbsp; <kbd>S</kbd>/<kbd>↓</kbd> тормоз</div>
        <div><kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> руль &nbsp; <kbd>Пробел</kbd> ручник</div>
        <div><kbd>Shift</kbd> ускорение &nbsp; <kbd>R</kbd> сброс &nbsp; <kbd>G</kbd> гараж</div>
    </div>
    
    <div id="gear">P</div>
    
    <div id="speedometer">
        <div id="speed-value">0</div>
        <div id="speed-unit">км/ч</div>
    </div>
    
    <div id="drift-score">
        <div class="label">Очки дрифта</div>
        <div class="value" id="score-value">0</div>
    </div>
    
    <div id="drift-combo">x1</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        // ============================================================
        //  Первая машина (sport) теперь использует tantoya-stupa.glb
        //  Автомасштабирование + центрирование + подъём на колёса.
        // ============================================================
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f1620);
        scene.fog = new THREE.Fog(0x0f1620, 180, 500);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1200);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // ===== ОСВЕЩЕНИЕ =====
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        
        const sunLight = new THREE.DirectionalLight(0xfff2d0, 1.3);
        sunLight.position.set(120, 200, 100);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.left = -120;
        sunLight.shadow.camera.right = 120;
        sunLight.shadow.camera.top = 120;
        sunLight.shadow.camera.bottom = -120;
        sunLight.shadow.camera.far = 400;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);
        
        scene.add(new THREE.HemisphereLight(0x8899cc, 0x223344, 0.5));
        
        // ===== ЗЕМЛЯ =====
        {
            const g = new THREE.PlaneGeometry(2000, 2000);
            g.rotateX(-Math.PI / 2);
            const m = new THREE.MeshStandardMaterial({ color: 0x1e2428, roughness: 0.98 });
            const ground = new THREE.Mesh(g, m);
            ground.receiveShadow = true;
            scene.add(ground);
        }
        
        // ===== ДОРОГИ =====
        const roadWidth = 14;
        const roadHalf = roadWidth / 2;
        const roadPositions = [-200, 0, 200];
        const intersectionPositions = [];
        roadPositions.forEach(x => roadPositions.forEach(z => intersectionPositions.push({ x, z })));
        
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.9 });
        
        function addRoadBox(cx, cz, w, l) {
            const g = new THREE.BoxGeometry(w, 0.05, l);
            const mesh = new THREE.Mesh(g, roadMat);
            mesh.position.set(cx, 0.02, cz);
            mesh.receiveShadow = true;
            scene.add(mesh);
        }
        
        roadPositions.forEach(z => {
            const xs = roadPositions.slice().sort((a, b) => a - b);
            let prev = -400;
            xs.forEach(x => {
                if (x - roadHalf > prev) addRoadBox((prev + x - roadHalf) / 2, z, (x - roadHalf) - prev, roadWidth);
                prev = x + roadHalf;
            });
            if (400 > prev) addRoadBox((prev + 400) / 2, z, 400 - prev, roadWidth);
        });
        roadPositions.forEach(x => {
            const zs = roadPositions.slice().sort((a, b) => a - b);
            let prev = -400;
            zs.forEach(z => {
                if (z - roadHalf > prev) addRoadBox(x, (prev + z - roadHalf) / 2, roadWidth, (z - roadHalf) - prev);
                prev = z + roadHalf;
            });
            if (400 > prev) addRoadBox(x, (prev + 400) / 2, roadWidth, 400 - prev);
        });
        intersectionPositions.forEach(({ x, z }) => addRoadBox(x, z, roadWidth, roadWidth));
        
        // ===== РАЗМЕТКА =====
        const yellowMarkMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.7, emissive: 0x332200 });
        const whiteMarkMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.7 });
        
        const yellowMatrices = [];
        const whiteMatrices = [];
        const tmpMat4 = new THREE.Matrix4();
        const tmpPos = new THREE.Vector3();
        
        roadPositions.forEach(z => {
            const xs = roadPositions.slice().sort((a, b) => a - b);
            let prev = -400;
            xs.forEach(x => {
                if (x - roadHalf > prev) {
                    const len = (x - roadHalf) - prev;
                    tmpPos.set((prev + x - roadHalf) / 2, 0.05, z);
                    tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(len, 0.05, 0.2));
                    yellowMatrices.push(tmpMat4.clone());
                }
                prev = x + roadHalf;
            });
            if (400 > prev) {
                const len = 400 - prev;
                tmpPos.set((prev + 400) / 2, 0.05, z);
                tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(len, 0.05, 0.2));
                yellowMatrices.push(tmpMat4.clone());
            }
        });
        roadPositions.forEach(x => {
            const zs = roadPositions.slice().sort((a, b) => a - b);
            let prev = -400;
            zs.forEach(z => {
                if (z - roadHalf > prev) {
                    const len = (z - roadHalf) - prev;
                    tmpPos.set(x, 0.05, (prev + z - roadHalf) / 2);
                    tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(0.2, 0.05, len));
                    yellowMatrices.push(tmpMat4.clone());
                }
                prev = z + roadHalf;
            });
            if (400 > prev) {
                const len = 400 - prev;
                tmpPos.set(x, 0.05, (prev + 400) / 2);
                tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(0.2, 0.05, len));
                yellowMatrices.push(tmpMat4.clone());
            }
        });
        
        roadPositions.forEach(z => {
            for (let x = -390; x <= 390; x += 8) {
                [-roadWidth / 4, roadWidth / 4].forEach(off => {
                    tmpPos.set(x, 0.05, z + off);
                    tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(3, 0.05, 0.15));
                    whiteMatrices.push(tmpMat4.clone());
                });
            }
        });
        roadPositions.forEach(x => {
            for (let z = -390; z <= 390; z += 8) {
                [-roadWidth / 4, roadWidth / 4].forEach(off => {
                    tmpPos.set(x + off, 0.05, z);
                    tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(0.15, 0.05, 3));
                    whiteMatrices.push(tmpMat4.clone());
                });
            }
        });
        
        const markGeo = new THREE.BoxGeometry(1, 1, 1);
        
        const yellowInst = new THREE.InstancedMesh(markGeo, yellowMarkMat, yellowMatrices.length);
        yellowMatrices.forEach((m, i) => yellowInst.setMatrixAt(i, m));
        yellowInst.instanceMatrix.needsUpdate = true;
        scene.add(yellowInst);
        
        const whiteInst = new THREE.InstancedMesh(markGeo, whiteMarkMat, whiteMatrices.length);
        whiteMatrices.forEach((m, i) => whiteInst.setMatrixAt(i, m));
        whiteInst.instanceMatrix.needsUpdate = true;
        scene.add(whiteInst);
        
        // ===== СВЕТОФОРЫ =====
        const trafficLights = [];
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6, metalness: 0.5 });
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
        const poleGeo = new THREE.CylinderGeometry(0.15, 0.2, 6, 6);
        const boxGeo = new THREE.BoxGeometry(0.7, 2, 0.5);
        const lightGeo = new THREE.SphereGeometry(0.22, 8, 8);
        
        function createTrafficLight(x, z, forAxis) {
            const group = new THREE.Group();
            
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.y = 3;
            pole.castShadow = true;
            group.add(pole);
            
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.y = 6;
            box.castShadow = true;
            group.add(box);
            
            const redMat = new THREE.MeshStandardMaterial({ color: 0x550000, emissive: 0x000000, emissiveIntensity: 0 });
            const yellowMat = new THREE.MeshStandardMaterial({ color: 0x555500, emissive: 0x000000, emissiveIntensity: 0 });
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x005500, emissive: 0x00ff00, emissiveIntensity: 0.3 });
            
            const redLight = new THREE.Mesh(lightGeo, redMat);
            redLight.position.set(0, 6.6, 0.28);
            group.add(redLight);
            
            const yellowLight = new THREE.Mesh(lightGeo, yellowMat);
            yellowLight.position.set(0, 6.0, 0.28);
            group.add(yellowLight);
            
            const greenLight = new THREE.Mesh(lightGeo, greenMat);
            greenLight.position.set(0, 5.4, 0.28);
            group.add(greenLight);
            
            group.position.set(x, 0, z);
            const angleToCenter = Math.atan2(-z, -x);
            group.rotation.y = angleToCenter + Math.PI / 2;
            scene.add(group);
            
            const tl = { group, x, z, forAxis, state: 'green', timer: 0, redMat, yellowMat, greenMat };
            trafficLights.push(tl);
            return tl;
        }
        
        intersectionPositions.forEach(({ x, z }) => {
            const tlX = createTrafficLight(x - roadHalf - 2, z - roadHalf - 2, 'x');
            const tlZ = createTrafficLight(x + roadHalf + 2, z + roadHalf + 2, 'z');
            tlX.partner = tlZ;
            tlZ.partner = tlX;
            tlX.state = 'green';
            tlZ.state = 'red';
        });
        
        const GREEN_TIME = 8;
        const YELLOW_TIME = 2;
        
        function updateTrafficLights(dt) {
            for (let i = 0; i < trafficLights.length; i++) {
                const tl = trafficLights[i];
                tl.timer += dt;
                
                if (tl.state === 'green' && tl.timer >= GREEN_TIME) {
                    tl.state = 'yellow';
                    tl.timer = 0;
                } else if (tl.state === 'yellow' && tl.timer >= YELLOW_TIME) {
                    tl.state = 'red';
                    tl.timer = 0;
                    if (tl.partner && tl.partner.state === 'red') {
                        tl.partner.state = 'green';
                        tl.partner.timer = 0;
                    }
                }
                
                if (tl.state === 'red') {
                    tl.redMat.emissive.setHex(0xff0000);
                    tl.redMat.emissiveIntensity = 1.5;
                    tl.yellowMat.emissiveIntensity = 0;
                    tl.greenMat.emissiveIntensity = 0;
                } else if (tl.state === 'yellow') {
                    tl.redMat.emissiveIntensity = 0;
                    tl.yellowMat.emissive.setHex(0xffcc00);
                    tl.yellowMat.emissiveIntensity = 1.5;
                    tl.greenMat.emissiveIntensity = 0;
                } else {
                    tl.redMat.emissiveIntensity = 0;
                    tl.yellowMat.emissiveIntensity = 0;
                    tl.greenMat.emissive.setHex(0x00ff00);
                    tl.greenMat.emissiveIntensity = 1.5;
                }
            }
        }
        
        // ===== ОПРЕДЕЛЕНИЯ МАШИН =====
        // Первая машина теперь использует GLB-модель.
        // Физические параметры (bodyW/bodyL) используются только для "призраков"
        // и расчётов, сама модель масштабируется автоматически.
        const CAR_DEFS = [
            { id: 'sport', name: 'TANTOYA STUPA', color: 0xFF1744, cabinColor: 0xD50000,
              modelUrl: 'tantoya-stupa.glb',
              stats: { speed: 85, accel: 75, handling: 60 },
              bodyW: 2.3, bodyH: 0.55, bodyL: 4.6, cabinH: 0.55, cabinL: 2.2,
              maxSpeed: 55, engineForce: 45, grip: 0.88 },
            { id: 'muscle', name: 'MUSCLE V8', color: 0x1565C0, cabinColor: 0x0D47A1,
              stats: { speed: 80, accel: 90, handling: 45 },
              bodyW: 2.5, bodyH: 0.65, bodyL: 4.9, cabinH: 0.6, cabinL: 2.0,
              maxSpeed: 52, engineForce: 55, grip: 0.86 },
            { id: 'drift', name: 'DRIFT KING', color: 0xFFC400, cabinColor: 0x222222,
              stats: { speed: 70, accel: 65, handling: 95 },
              bodyW: 2.2, bodyH: 0.5, bodyL: 4.4, cabinH: 0.5, cabinL: 2.0,
              maxSpeed: 50, engineForce: 40, grip: 0.82 },
            { id: 'super', name: 'HYPER X', color: 0x00E676, cabinColor: 0x004D40,
              stats: { speed: 100, accel: 85, handling: 70 },
              bodyW: 2.2, bodyH: 0.45, bodyL: 4.5, cabinH: 0.45, cabinL: 2.1,
              maxSpeed: 62, engineForce: 50, grip: 0.90 }
        ];
        
        let selectedCarId = 'sport';
        
        // Общие материалы
        const sharedWheelMat = new THREE.MeshStandardMaterial({ color: 0x0A0A0A, roughness: 0.9 });
        const sharedRimMat = new THREE.MeshStandardMaterial({ color: 0xC0C0C0, metalness: 0.95, roughness: 0.15 });
        const sharedGlassMat = new THREE.MeshStandardMaterial({ color: 0x111820, roughness: 0.05, metalness: 0.95, transparent: true, opacity: 0.85 });
        const sharedSpoilerMat = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.5, metalness: 0.8 });
        const sharedDarkMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
        const sharedHeadlightMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, emissive: 0xFFEEAA, emissiveIntensity: 1.2 });
        const sharedTaillightMat = new THREE.MeshStandardMaterial({ color: 0xFF0000, emissive: 0xFF0000, emissiveIntensity: 1.0 });
        
        const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 14);
        wheelGeo.rotateZ(Math.PI / 2);
        const rimGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.37, 6);
        rimGeo.rotateZ(Math.PI / 2);
        
        // ===== КЭШ GLB-МОДЕЛЕЙ =====
        const gltfLoader = new GLTFLoader();
        const glbCache = new Map(); // url -> Promise<Group>
        
        function loadGLB(url) {
            if (glbCache.has(url)) return glbCache.get(url);
            const p = new Promise((resolve, reject) => {
                gltfLoader.load(url, (gltf) => {
                    // Клонируем сцены для каждой копии (если нужно несколько)
                    resolve(gltf.scene);
                }, undefined, reject);
            });
            glbCache.set(url, p);
            return p;
        }
        
        // Нормализация GLB: центр в (0,0,0), масштаб под ~4.6 длины, колёса на земле.
        // Ориентация: считаем, что "вперёд" модели — это +Z (как у наших машин).
        // Если у модели "вперёд" — это -Z или +X, раскомментируйте нужную строку.
        function normalizeGLB(root, targetLength = 4.6) {
            const wrapper = new THREE.Group();
            const inner = new THREE.Group();
            wrapper.add(inner);
            
            inner.add(root);
            
            // Применяем поворот, если модель ориентирована иначе:
            // root.rotation.y = Math.PI;      // если "вперёд" = -Z
            // root.rotation.y = -Math.PI/2;   // если "вперёд" = +X
            // root.rotation.y = Math.PI/2;    // если "вперёд" = -X
            
            // Считаем bounding box
            const box = new THREE.Box3().setFromObject(inner);
            const size = new THREE.Vector3();
            box.getSize(size);
            const center = new THREE.Vector3();
            box.getCenter(center);
            
            // Масштаб по самой длинной горизонтальной оси
            const maxHorizontal = Math.max(size.x, size.z);
            const scale = targetLength / Math.max(maxHorizontal, 0.001);
            inner.scale.setScalar(scale);
            
            // Центрируем по X/Z и ставим низ на y=0
            inner.position.x = -center.x * scale;
            inner.position.z = -center.z * scale;
            inner.position.y = -box.min.y * scale;
            
            // Включаем тени на всех мешах
            inner.traverse(obj => {
                if (obj.isMesh) {
                    obj.castShadow = true;
                    obj.receiveShadow = true;
                }
            });
            
            return wrapper;
        }

            const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(def.bodyW - 0.3, 0.08, 0.5), sharedSpoilerMat);

            const wheels = [];

            const halfLen = 0.45;
            const halfWid = 0.18;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            
            const fx = sin * halfLen, fz = cos * halfLen;
            const rx = cos * halfWid, rz = -sin * halfWid;
            
            const i = skidHead * 12;
            skidPositions[i + 0] = x - fx - rx;
            skidPositions[i + 1] = 0.03;
            skidPositions[i + 2] = z - fz - rz;
            skidPositions[i + 3] = x - fx + rx;
            skidPositions[i + 4] = 0.03;
            skidPositions[i + 5] = z - fz + rz;
            skidPositions[i + 6] = x + fx + rx;
            skidPositions[i + 7] = 0.03;
            skidPositions[i + 8] = z + fz + rz;
            skidPositions[i + 9] = x + fx - rx;
            skidPositions[i + 10] = 0.03;
            skidPositions[i + 11] = z + fz - rz;
            
            skidHead = (skidHead + 1) % MAX_SKID;
            skidCount = Math.min(skidCount + 1, MAX_SKID);
            
            skidGeo.attributes.position.needsUpdate = true;
            skidGeo.setDrawRange(0, skidCount * 6);

        // ===== NPC =====

        const npcDef = { color: 0x888888, cabinColor: 0x111111, bodyW: 2.2, bodyH: 0.6, bodyL: 4.5, cabinH: 0.55, cabinL: 2.1 };
        
        const DIRS = [
            { dx: 1, dz: 0, angle: Math.PI / 2 },
            { dx: 0, dz: 1, angle: 0 },
            { dx: -1, dz: 0, angle: -Math.PI / 2 },
            { dx: 0, dz: -1, angle: Math.PI }
        ];
        
        const LANE_OFFSET = roadWidth / 4;
        
        function computeLanePos(roadPos, dir, axis) {
            if (dir.dx === 1) return roadPos + LANE_OFFSET;
            if (dir.dx === -1) return roadPos - LANE_OFFSET;
            if (dir.dz === 1) return roadPos - LANE_OFFSET;
            if (dir.dz === -1) return roadPos + LANE_OFFSET;
        }

                const laneZ = computeLanePos(roadCoord, dir, 'x');
                posX = dirIdx === 0 ? -380 : 380;
                posZ = laneZ;
            } else {
                const roadCoord = roadPositions[roadChoice - roadPositions.length];
                dirIdx = Math.random() < 0.5 ? 1 : 3;
                const dir = DIRS[dirIdx];
                const laneX = computeLanePos(roadCoord, dir, 'z');
                posX = laneX;

        function getLightForNPC(npc) {
            let nearest = null, nearestDist = Infinity;
            for (const inter of intersectionPositions) {
                const dx = inter.x - npc.posX;
                const dz = inter.z - npc.posZ;
                const forwardDot = dx * npc.dir.dx + dz * npc.dir.dz;
                if (forwardDot < 0) continue;
                const perpDist = Math.abs(dx * npc.dir.dz - dz * npc.dir.dx);
                if (perpDist > roadWidth / 2) continue;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < nearestDist) {
                    nearestDist = dist;
                    nearest = { inter, dist };
                }
            }
            if (!nearest) return null;
            
            const tl = trafficLights.find(t =>
                Math.abs(t.x - nearest.inter.x) < roadWidth + 5 &&
                Math.abs(t.z - nearest.inter.z) < roadWidth + 5 &&
                t.forAxis === npc.axis
            );
            return { light: tl, dist: nearestDist, intersection: nearest.inter };
        }
        
        function updateNPCs(dt) {
            for (let i = 0; i < npcs.length; i++) {
                const npc = npcs[i];
                
                const lightInfo = getLightForNPC(npc);
                let shouldStop = false;
                if (lightInfo && lightInfo.light) {
                    if (lightInfo.dist < 20 && lightInfo.dist > 3) {
                        if (lightInfo.light.state === 'red' || lightInfo.light.state === 'yellow') {
                            shouldStop = true;
                        }
                    }
                }
                
                let desiredSpeed = npc.maxSpeed;
                if (shouldStop) desiredSpeed = 0;
                else if (lightInfo && lightInfo.dist < 10 && lightInfo.light && lightInfo.light.state === 'yellow') {
                    desiredSpeed = Math.min(desiredSpeed, 4);
                }
                
                npc.speed += (desiredSpeed - npc.speed) * Math.min(dt * 3, 1);
                if (npc.speed < 0.1) npc.speed = 0;
                
                npc.posX += npc.dir.dx * npc.speed * dt;
                npc.posZ += npc.dir.dz * npc.speed * dt;
                
                if (!npc.turning) {
                    for (const inter of intersectionPositions) {
                        const dx = inter.x - npc.posX;
                        const dz = inter.z - npc.posZ;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        const forwardDot = dx * npc.dir.dx + dz * npc.dir.dz;
                        if (forwardDot > 0 && dist < 5) {
                            if (Math.random() < 0.35) {
                                const curIdx = DIRS.findIndex(d => d.dx === npc.dir.dx && d.dz === npc.dir.dz);
                                const left = Math.random() < 0.5;
                                let newIdx = left ? (curIdx + 1) % 4 : (curIdx + 3) % 4;
                                npc.targetDirIdx = newIdx;
                                npc.turning = true;
                                let diff = DIRS[newIdx].angle - npc.angle;
                                while (diff > Math.PI) diff -= Math.PI * 2;
                                while (diff < -Math.PI) diff += Math.PI * 2;
                                npc.targetAngle = npc.angle + diff;
                            }
                            break;
                        }
                    }
                }
                
                if (npc.turning) {
                    const diff = npc.targetAngle - npc.angle;
                    npc.angle += diff * Math.min(dt * 4, 1);
                    if (Math.abs(diff) < 0.05) {
                        npc.angle = npc.targetAngle;
                        npc.turning = false;
                        npc.dir = { ...DIRS[npc.targetDirIdx] };
                        npc.axis = (npc.dir.dx !== 0) ? 'x' : 'z';
                        
                        if (npc.axis === 'x') {
                            const nearestZ = roadPositions.reduce((a, b) => Math.abs(b - npc.posZ) < Math.abs(a - npc.posZ) ? b : a);
                            npc.posZ = computeLanePos(nearestZ, npc.dir, 'x');
                        } else {
                            const nearestX = roadPositions.reduce((a, b) => Math.abs(b - npc.posX) < Math.abs(a - npc.posX) ? b : a);
                            npc.posX = computeLanePos(nearestX, npc.dir, 'z');
                        }
                    }
                }
                
                if (Math.abs(npc.posX) > 450 || Math.abs(npc.posZ) > 450) {
                    if (npc.dir.dx !== 0) {
                        npc.posX = npc.dir.dx > 0 ? -380 : 380;
                    } else {
                        npc.posZ = npc.dir.dz > 0 ? -380 : 380;
                    }
                }
                
                npc.model.position.set(npc.posX, 0, npc.posZ);
                npc.model.rotation.y = npc.angle;
            }
        }
        
        // ===== УПРАВЛЕНИЕ =====
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;

        function resetCar() {
            if (!car) return;
            carState.posX = -100;
            carState.posZ = 3.5;
            carState.velocityX = 0;
            carState.velocityZ = 0;
            carState.angle = Math.PI / 2;

            carState.driftCombo = 1;
            carState.isDrifting = false;

        }
        
        // ===== ФИЗИКА =====
        function updatePhysics(dt) {
            if (!car) return;
            
            carState.throttle = (keys['KeyW'] || keys['ArrowUp']) ? 1 : 0;
            carState.brake = (keys['KeyS'] || keys['ArrowDown']) ? 1 : 0;
            carState.handbrake = keys['Space'] === true;
            carState.boost = keys['ShiftLeft'] === true || keys['ShiftRight'] === true;
            
            let targetSteer = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) targetSteer = 1;
            if (keys['KeyD'] || keys['ArrowRight']) targetSteer = -1;
            carState.steerInput = THREE.MathUtils.lerp(carState.steerInput, targetSteer, dt * 10);
            carState.steeringAngle = carState.steerInput * 0.5;
            
            const cosA = Math.cos(carState.angle);
            const sinA = Math.sin(carState.angle);
            const forwardX = sinA, forwardZ = cosA;
            const rightX = cosA, rightZ = -sinA;
            
            let vForward = carState.velocityX * forwardX + carState.velocityZ * forwardZ;
            const speed = Math.sqrt(carState.velocityX ** 2 + carState.velocityZ ** 2);
            
            const maxForce = carState.maxEngineForce * (carState.boost ? 1.6 : 1.0);
            let engineForce = 0;
            if (carState.throttle > 0) engineForce = maxForce;
            else if (carState.brake > 0) {
                engineForce = vForward > 0.5 ? -carState.brakeForce : -carState.maxReverseForce;
            }
            
            carState.velocityX += forwardX * engineForce * dt;
            carState.velocityZ += forwardZ * engineForce * dt;
            
            if (carState.handbrake) {
                const hb = Math.max(0, 1 - carState.handbrakeForce * dt / Math.max(speed, 1));
                carState.velocityX *= hb;
                carState.velocityZ *= hb;
            }
            
            carState.velocityX *= Math.pow(0.99, dt * 60 * (1 + speed * 0.02));
            carState.velocityZ *= Math.pow(0.99, dt * 60 * (1 + speed * 0.02));
            
            const roll = Math.max(0, 1 - carState.rollingResistance * dt / Math.max(speed, 0.5));
            carState.velocityX *= roll;
            carState.velocityZ *= roll;
            
            vForward = carState.velocityX * forwardX + carState.velocityZ * forwardZ;
            let vRight = carState.velocityX * rightX + carState.velocityZ * rightZ;
            const speedAbs = Math.abs(vForward);
            
            if (speedAbs > 0.5) {
                let turnRate = carState.steeringAngle * 2.5;
                turnRate *= Math.min(speedAbs / 8, 1);
                const moveDir = vForward > 0 ? 1 : -1;
                const driftMult = carState.handbrake ? 1.8 : 1.0;
                carState.angularVelocity = turnRate * moveDir * driftMult * 3;
            } else {
                carState.angularVelocity *= 0.9;
            }
            
            carState.angle += carState.angularVelocity * dt;
            
            const nCos = Math.cos(carState.angle);
            const nSin = Math.sin(carState.angle);
            const nFx = nSin, nFz = nCos;
            const nRx = nCos, nRz = -nSin;
            
            vForward = carState.velocityX * nFx + carState.velocityZ * nFz;
            vRight = carState.velocityX * nRx + carState.velocityZ * nRz;
            
            let grip;
            if (carState.handbrake) grip = 0.94;
            else {
                grip = Math.pow(carState.gripFactor, dt * 60);
                if (Math.abs(vRight) > 15) grip *= 1.15;
            }
            vRight *= grip;
            const maxSide = carState.handbrake ? 40 : 25;
            vRight = Math.max(-maxSide, Math.min(maxSide, vRight));
            
            carState.velocityX = nFx * vForward + nRx * vRight;
            carState.velocityZ = nFz * vForward + nRz * vRight;
            
            const totalSpeed = Math.sqrt(carState.velocityX ** 2 + carState.velocityZ ** 2);
            const maxSp = carState.boost ? carState.maxSpeed * 1.3 : carState.maxSpeed;
            if (totalSpeed > maxSp) {
                const s = maxSp / totalSpeed;
                carState.velocityX *= s;
                carState.velocityZ *= s;
            }
            
            carState.posX += carState.velocityX * dt;
            carState.posZ += carState.velocityZ * dt;
            
            const finalSpeed = Math.sqrt(carState.velocityX ** 2 + carState.velocityZ ** 2);
            const driftAngle = Math.abs(Math.atan2(vRight, Math.abs(vForward))) * 180 / Math.PI;
            
            carState.isDrifting = (driftAngle > 18 && finalSpeed > 10) || (carState.handbrake && finalSpeed > 8);
            carState.driftAngle = driftAngle;
            
            if (carState.isDrifting) {
                carState.driftTimer += dt;
                carState.driftScore += driftAngle * finalSpeed * dt * 0.4;
                carState.driftCombo = Math.min(1 + carState.driftTimer * 0.4, 5);
            } else {
                if (carState.driftTimer > 0.6) carState.driftCombo = 1;
                carState.driftTimer = 0;
            }
            
            // Следы шин
            if (carState.isDrifting) {
                const rearL_local = { x: -1.1, z: -1.5 };
                const rearR_local = { x: 1.1, z: -1.5 };
                
                const rearL_world = {
                    x: carState.posX + nCos * rearL_local.x + nSin * rearL_local.z,
                    z: carState.posZ - nSin * rearL_local.x + nCos * rearL_local.z
                };
                const rearR_world = {
                    x: carState.posX + nCos * rearR_local.x + nSin * rearR_local.z,
                    z: carState.posZ - nSin * rearR_local.x + nCos * rearR_local.z
                };
                
                const marks = [rearL_world, rearR_world];
                marks.forEach((pos, i) => {
                    if (lastSkidPositions[i]) {
                        const dx = pos.x - lastSkidPositions[i].x;
                        const dz = pos.z - lastSkidPositions[i].z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        if (dist > 0.35) {
                            addSkidMark((pos.x + lastSkidPositions[i].x) / 2, (pos.z + lastSkidPositions[i].z) / 2, Math.atan2(dx, dz));
                            lastSkidPositions[i] = { x: pos.x, z: pos.z };
                        }
                    } else {
                        lastSkidPositions[i] = { x: pos.x, z: pos.z };
                    }
                });
            } else {
                lastSkidPositions[0] = null;
                lastSkidPositions[1] = null;
            }
            
            // Визуал
            car.position.set(carState.posX, 0, carState.posZ);
            car.rotation.y = carState.angle;
            const rollAmount = -carState.angularVelocity * 0.06;
            const pitchAmount = (carState.throttle - carState.brake) * 0.015;
            car.rotation.z = THREE.MathUtils.lerp(car.rotation.z, rollAmount, dt * 5);
            car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, pitchAmount, dt * 5);
            
            carState.wheelSpin += vForward * dt / 0.42;
            
            // Вращение колёс (работает только для процедурных машин;
            // для GLB массив пустой — просто пропускается)
            const wheels = car.userData.wheels || [];
            for (let i = 0; i < wheels.length; i++) wheels[i].rotation.x = carState.wheelSpin;
            const fWheels = car.userData.frontWheels || [];
            for (let i = 0; i < fWheels.length; i++) fWheels[i].rotation.y = carState.steeringAngle;
        }
        
        // ===== КАМЕРА =====
        const camTargetVec = new THREE.Vector3();
        
        function updateCamera() {
            if (!car) return;
            
            const dist = 10;
            const height = 4.5;
            
            const sinA = Math.sin(carState.angle);
            const cosA = Math.cos(carState.angle);
            
            camera.position.set(
                carState.posX - sinA * dist,
                height,
                carState.posZ - cosA * dist
            );
            
            camTargetVec.set(
                carState.posX + sinA * 3,
                1.5,
                carState.posZ + cosA * 3
            );
            camera.lookAt(camTargetVec);
        }
        
        // ===== HUD =====
        const speedValueEl = document.getElementById('speed-value');
        const gearEl = document.getElementById('gear');
        const scoreValueEl = document.getElementById('score-value');
        const comboEl = document.getElementById('drift-combo');
        
        let hudTimer = 0;
        function updateHUD(dt) {
            if (!car) return;
            hudTimer += dt;
            if (hudTimer < 0.05) return;
            hudTimer = 0;
            
            const speed = Math.sqrt(carState.velocityX ** 2 + carState.velocityZ ** 2);
            const kmh = speed * 3.6;
            speedValueEl.textContent = Math.round(kmh);
            
            if (kmh > 180) speedValueEl.style.color = '#FF1744';
            else if (kmh > 120) speedValueEl.style.color = '#FFC107';
            else speedValueEl.style.color = '#4CAF50';
            
            const localF = carState.velocityX * Math.sin(carState.angle) + carState.velocityZ * Math.cos(carState.angle);
            if (Math.abs(localF) < 0.5) {
                gearEl.textContent = 'N';
                gearEl.style.color = '#FFC107';
            } else if (localF < 0) {
                gearEl.textContent = 'R';
                gearEl.style.color = '#FF5252';
            } else {
                gearEl.textContent = 'D';
                gearEl.style.color = '#4CAF50';
            }
            
            scoreValueEl.textContent = Math.round(carState.driftScore);
            
            if (carState.driftCombo > 1.05) {
                comboEl.textContent = 'x' + carState.driftCombo.toFixed(1);
                comboEl.classList.add('active');
            } else {
                comboEl.classList.remove('active');
            }
        }
        
        // ===== КНОПКИ ГАРАЖА =====
        startBtn.addEventListener('click', async () => {
            garageEl.classList.add('hidden');
            await spawnPlayerCar(selectedCarId);
            clearSkidMarks();
            lastSkidPositions[0] = null;
            lastSkidPositions[1] = null;
        });
        
        garageBtn.addEventListener('click', () => {
            garageEl.classList.remove('hidden');
        });
        
        // ===== ФОНАРИ =====
        {
            const lampPositions = [];
            roadPositions.forEach(z => {
                for (let x = -380; x <= 380; x += 60) {
                    lampPositions.push({ x, z: z + roadHalf + 2 });
                }
            });
            
            const poleGeo2 = new THREE.CylinderGeometry(0.15, 0.2, 8, 6);
            const poleMat2 = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7 });
            const poleInst = new THREE.InstancedMesh(poleGeo2, poleMat2, lampPositions.length);
            
            const lampGeo2 = new THREE.SphereGeometry(0.4, 8, 8);
            const lampMat2 = new THREE.MeshStandardMaterial({ color: 0xFFFFAA, emissive: 0xFFFF88, emissiveIntensity: 1.5 });
            const lampInst = new THREE.InstancedMesh(lampGeo2, lampMat2, lampPositions.length);
            
            const mat = new THREE.Matrix4();
            lampPositions.forEach((p, i) => {
                mat.makeTranslation(p.x, 4, p.z);
                poleInst.setMatrixAt(i, mat);
                mat.makeTranslation(p.x, 8, p.z);
                lampInst.setMatrixAt(i, mat);
            });
            poleInst.instanceMatrix.needsUpdate = true;
            lampInst.instanceMatrix.needsUpdate = true;
            scene.add(poleInst);
            scene.add(lampInst);
        }
        
        // ===== ЗАПУСК =====
        const clock = new THREE.Clock();
        
        (async () => {
            // Сначала строим превью в гараже
            await buildGarageUI();
            
            // Грузим все машины (для кэша) параллельно, но первую — сразу
            await spawnPlayerCar(selectedCarId);
            
            // Спавним NPC (процедурные, быстро)
            for (let i = 0; i < NPC_COUNT; i++) {
                await spawnNPC();
            }
        })();
        
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            
            const garageOpen = !garageEl.classList.contains('hidden');
            
            if (!garageOpen && car) {
                updatePhysics(dt);
                updateCamera();
                updateHUD(dt);
            } else {
                const t = Date.now() * 0.0003;
                camera.position.set(
                    carState.posX + Math.sin(t) * 15,
                    7,
                    carState.posZ + Math.cos(t) * 15
                );
                camera.lookAt(carState.posX, 1, carState.posZ);
            }
            
            updateNPCs(dt);
            updateTrafficLights(dt);
            
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        camera.position.set(-100, 5, -10);
        animate();
    </script>
</body>
</html>
