<!DOCTYPE html>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        #info { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.65); padding: 14px 18px; border-radius: 10px; backdrop-filter: blur(10px); font-size: 13px; line-height: 1.6; border: 1px solid rgba(255,255,255,0.15); pointer-events: none; }
        #info h1 { font-size: 16px; margin-bottom: 6px; color: #FF5252; }
        #info kbd { background: rgba(255,255,255,0.2); padding: 1px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; }
        #speedometer { position: absolute; bottom: 30px; right: 30px; width: 170px; height: 170px; background: rgba(0,0,0,0.7); border-radius: 50%; border: 3px solid #FF5252; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(255, 82, 82, 0.4); }
        #speed-value { font-size: 42px; font-weight: bold; color: #FF5252; line-height: 1; }
        #speed-unit { font-size: 12px; color: #aaa; margin-top: 3px; }
        #gear-box { position: absolute; bottom: 30px; left: 30px; color: white; background: rgba(0,0,0,0.7); padding: 10px 18px; border-radius: 10px; font-size: 16px; font-weight: bold; backdrop-filter: blur(10px); border: 2px solid #FF5252; min-width: 100px; text-align: center; }
        #gear-box .rpm-val { font-size: 22px; color: #FFEB3B; }
        #gear-box .gear-val { font-size: 28px; color: #4CAF50; }
        #gear-box .small { font-size: 11px; color: #aaa; }
        #drift-score { position: absolute; top: 20px; right: 20px; color: white; background: rgba(0,0,0,0.7); padding: 12px 22px; border-radius: 10px; backdrop-filter: blur(10px); border: 2px solid #FFEB3B; text-align: right; min-width: 150px; }
        #drift-score .label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }
        #drift-score .value { font-size: 28px; font-weight: bold; color: #FFEB3B; }
        #drift-combo { position: absolute; top: 100px; right: 20px; color: #FF9800; background: rgba(0,0,0,0.7); padding: 6px 18px; border-radius: 10px; backdrop-filter: blur(10px); font-size: 18px; font-weight: bold; opacity: 0; transition: opacity 0.2s, transform 0.2s; }
        #drift-combo.active { opacity: 1; transform: scale(1.05); }
        #garage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 15, 0.92); backdrop-filter: blur(15px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; transition: opacity 0.4s; }
        #garage.hidden { opacity: 0; pointer-events: none; }
        #garage h2 { color: white; font-size: 42px; margin-bottom: 8px; letter-spacing: 8px; font-weight: 900; background: linear-gradient(90deg, #FF1744, #FFEB3B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #garage-subtitle { color: #888; font-size: 14px; letter-spacing: 3px; margin-bottom: 40px; text-transform: uppercase; }
        #car-list { display: flex; gap: 25px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; max-width: 1100px; }
        .car-card { width: 200px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.25s; text-align: center; }
        .car-card:hover { border-color: #FF5252; transform: translateY(-8px); background: rgba(255,255,255,0.08); box-shadow: 0 15px 40px rgba(255, 82, 82, 0.3); }
        .car-card.selected { border-color: #FFEB3B; background: rgba(255, 235, 59, 0.1); box-shadow: 0 0 30px rgba(255, 235, 59, 0.4); }
        .car-preview { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .car-card h3 { color: white; font-size: 15px; margin-bottom: 6px; }
        .car-card .car-stats { color: #888; font-size: 11px; line-height: 1.6; }
        .car-card .car-stats span { color: #FFEB3B; }
        #start-btn { padding: 18px 60px; font-size: 20px; font-weight: bold; letter-spacing: 4px; color: white; background: linear-gradient(135deg, #FF1744, #FF5252); border: none; border-radius: 12px; cursor: pointer; transition: all 0.25s; box-shadow: 0 8px 30px rgba(255, 23, 68, 0.5); text-transform: uppercase; }
        #start-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255, 23, 68, 0.7); }
        #garage-btn { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 24px; background: rgba(0,0,0,0.7); color: white; border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; cursor: pointer; font-size: 13px; letter-spacing: 2px; backdrop-filter: blur(10px); transition: all 0.2s; z-index: 100; }
        #garage-btn:hover { border-color: #FF5252; color: #FF5252; }
    </style>
</head>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f1620);
        scene.fog = new THREE.Fog(0x0f1620, 180, 500);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1200);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        document.body.appendChild(renderer.domElement);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sunLight = new THREE.DirectionalLight(0xfff2d0, 1.3);
        sunLight.position.set(120, 200, 100);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.left = -120;
        sunLight.shadow.camera.right = 120;
        sunLight.shadow.camera.top = 120;
        sunLight.shadow.camera.bottom = -120;
        sunLight.shadow.camera.far = 400;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);
        scene.add(new THREE.HemisphereLight(0x8899cc, 0x223344, 0.5));
        
        // ===== ЗЕМЛЯ =====
        {
            const g = new THREE.PlaneGeometry(2000, 2000); g.rotateX(-Math.PI / 2);
            const m = new THREE.MeshStandardMaterial({ color: 0x1e2428, roughness: 0.98 });
            const ground = new THREE.Mesh(g, m); ground.receiveShadow = true; scene.add(ground);
        }
        
        // ===== ДОРОГИ =====
        const roadWidth = 14, roadHalf = roadWidth / 2;
        const roadPositions = [-200, 0, 200];
        const intersectionPositions = [];
        roadPositions.forEach(x => roadPositions.forEach(z => intersectionPositions.push({ x, z })));
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.9 });
        function addRoadBox(cx, cz, w, l) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, l), roadMat);
            mesh.position.set(cx, 0.02, cz); mesh.receiveShadow = true; scene.add(mesh);
        }
        roadPositions.forEach(z => {
            const xs = roadPositions.slice().sort((a, b) => a - b); let prev = -400;
            xs.forEach(x => { if (x - roadHalf > prev) addRoadBox((prev + x - roadHalf) / 2, z, (x - roadHalf) - prev, roadWidth); prev = x + roadHalf; });
            if (400 > prev) addRoadBox((prev + 400) / 2, z, 400 - prev, roadWidth);
        });
        roadPositions.forEach(x => {
            const zs = roadPositions.slice().sort((a, b) => a - b); let prev = -400;
            zs.forEach(z => { if (z - roadHalf > prev) addRoadBox(x, (prev + z - roadHalf) / 2, roadWidth, (z - roadHalf) - prev); prev = z + roadHalf; });
            if (400 > prev) addRoadBox(x, (prev + 400) / 2, roadWidth, 400 - prev);
        });
        intersectionPositions.forEach(({ x, z }) => addRoadBox(x, z, roadWidth, roadWidth));
        
        // ===== РАЗМЕТКА =====
        const yellowMarkMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.7, emissive: 0x332200 });
        const whiteMarkMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.7 });
        const yellowMatrices = [], whiteMatrices = [];
        const tmpMat4 = new THREE.Matrix4(), tmpPos = new THREE.Vector3();
        roadPositions.forEach(z => {
            const xs = roadPositions.slice().sort((a, b) => a - b); let prev = -400;
            xs.forEach(x => {
                if (x - roadHalf > prev) {
                    const len = (x - roadHalf) - prev;
                    tmpPos.set((prev + x - roadHalf) / 2, 0.05, z);
                    tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(len, 0.05, 0.2));
                    yellowMatrices.push(tmpMat4.clone());
                }
                prev = x + roadHalf;
            });
            if (400 > prev) {
                const len = 400 - prev;
                tmpPos.set((prev + 400) / 2, 0.05, z);
                tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(len, 0.05, 0.2));
                yellowMatrices.push(tmpMat4.clone());
            }
        });
        roadPositions.forEach(x => {
            const zs = roadPositions.slice().sort((a, b) => a - b); let prev = -400;
            zs.forEach(z => {
                if (z - roadHalf > prev) {
                    const len = (z - roadHalf) - prev;
                    tmpPos.set(x, 0.05, (prev + z - roadHalf) / 2);
                    tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(0.2, 0.05, len));
                    yellowMatrices.push(tmpMat4.clone());
                }
                prev = z + roadHalf;
            });
            if (400 > prev) {
                const len = 400 - prev;
                tmpPos.set(x, 0.05, (prev + 400) / 2);
                tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(0.2, 0.05, len));
                yellowMatrices.push(tmpMat4.clone());
            }
        });
        roadPositions.forEach(z => { for (let x = -390; x <= 390; x += 8) { [-roadWidth / 4, roadWidth / 4].forEach(off => { tmpPos.set(x, 0.05, z + off); tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(3, 0.05, 0.15)); whiteMatrices.push(tmpMat4.clone()); }); } });
        roadPositions.forEach(x => { for (let z = -390; z <= 390; z += 8) { [-roadWidth / 4, roadWidth / 4].forEach(off => { tmpPos.set(x + off, 0.05, z); tmpMat4.compose(tmpPos, new THREE.Quaternion(), new THREE.Vector3(0.15, 0.05, 3)); whiteMatrices.push(tmpMat4.clone()); }); } });
        const markGeo = new THREE.BoxGeometry(1, 1, 1);
        const yellowInst = new THREE.InstancedMesh(markGeo, yellowMarkMat, yellowMatrices.length);
        yellowMatrices.forEach((m, i) => yellowInst.setMatrixAt(i, m));
        yellowInst.instanceMatrix.needsUpdate = true; scene.add(yellowInst);
        const whiteInst = new THREE.InstancedMesh(markGeo, whiteMarkMat, whiteMatrices.length);
        whiteMatrices.forEach((m, i) => whiteInst.setMatrixAt(i, m));
        whiteInst.instanceMatrix.needsUpdate = true; scene.add(whiteInst);
        
        // ===== СВЕТОФОРЫ =====
        const trafficLights = [];
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6, metalness: 0.5 });
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
        const poleGeo = new THREE.CylinderGeometry(0.15, 0.2, 6, 6);
        const boxGeo = new THREE.BoxGeometry(0.7, 2, 0.5);
        const lightGeo = new THREE.SphereGeometry(0.22, 8, 8);
        function createTrafficLight(x, z, forAxis) {
            const group = new THREE.Group();
            const pole = new THREE.Mesh(poleGeo, poleMat); pole.position.y = 3; pole.castShadow = true; group.add(pole);
            const box = new THREE.Mesh(boxGeo, boxMat); box.position.y = 6; box.castShadow = true; group.add(box);
            const redMat = new THREE.MeshStandardMaterial({ color: 0x550000, emissive: 0x000000, emissiveIntensity: 0 });
            const yellowMat = new THREE.MeshStandardMaterial({ color: 0x555500, emissive: 0x000000, emissiveIntensity: 0 });
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x005500, emissive: 0x00ff00, emissiveIntensity: 0.3 });
            const r = new THREE.Mesh(lightGeo, redMat); r.position.set(0, 6.6, 0.28); group.add(r);
            const y = new THREE.Mesh(lightGeo, yellowMat); y.position.set(0, 6.0, 0.28); group.add(y);
            const g = new THREE.Mesh(lightGeo, greenMat); g.position.set(0, 5.4, 0.28); group.add(g);
            group.position.set(x, 0, z); group.rotation.y = Math.atan2(-z, -x) + Math.PI / 2; scene.add(group);
            const tl = { group, x, z, forAxis, state: 'green', timer: 0, redMat, yellowMat, greenMat };
            trafficLights.push(tl); return tl;
        }
        intersectionPositions.forEach(({ x, z }) => {
            const tlX = createTrafficLight(x - roadHalf - 2, z - roadHalf - 2, 'x');
            const tlZ = createTrafficLight(x + roadHalf + 2, z + roadHalf + 2, 'z');
            tlX.partner = tlZ; tlZ.partner = tlX;
            tlX.state = 'green'; tlZ.state = 'red';
        });
        const GREEN_TIME = 8, YELLOW_TIME = 2;
        function updateTrafficLights(dt) {
            for (let i = 0; i < trafficLights.length; i++) {
                const tl = trafficLights[i]; tl.timer += dt;
                if (tl.state === 'green' && tl.timer >= GREEN_TIME) { tl.state = 'yellow'; tl.timer = 0; }
                else if (tl.state === 'yellow' && tl.timer >= YELLOW_TIME) {
                    tl.state = 'red'; tl.timer = 0;
                    if (tl.partner && tl.partner.state === 'red') { tl.partner.state = 'green'; tl.partner.timer = 0; }
                }
                if (tl.state === 'red') { tl.redMat.emissive.setHex(0xff0000); tl.redMat.emissiveIntensity = 1.5; tl.yellowMat.emissiveIntensity = 0; tl.greenMat.emissiveIntensity = 0; }
                else if (tl.state === 'yellow') { tl.redMat.emissiveIntensity = 0; tl.yellowMat.emissive.setHex(0xffcc00); tl.yellowMat.emissiveIntensity = 1.5; tl.greenMat.emissiveIntensity = 0; }
                else { tl.redMat.emissiveIntensity = 0; tl.yellowMat.emissiveIntensity = 0; tl.greenMat.emissive.setHex(0x00ff00); tl.greenMat.emissiveIntensity = 1.5; }
            }
        }
        
        // ===== ОПРЕДЕЛЕНИЯ МАШИН =====
        // tantoya-stupa = Toyota Supra A80 Twin Turbo
        // neasun-slide = Nissan Skyline R34 GT-R C-West (1999)
        const CAR_DEFS = [
            {
                id: 'supra', name: 'TANTOYA STUPA (Supra A80)', color: 0xFF1744, cabinColor: 0xD50000,
                modelUrl: 'tantoya-stupa.glb',

                torqueCurve: [
                    { rpm: 800, torque: 180 }, { rpm: 1500, torque: 280 }, { rpm: 2500, torque: 380 },
                    { rpm: 3600, torque: 440 }, { rpm: 4800, torque: 430 }, { rpm: 5600, torque: 380 },
                    { rpm: 6500, torque: 310 }, { rpm: 7000, torque: 250 }, { rpm: 7200, torque: 0 }
                ],
                idleRpm: 800, redlineRpm: 7000, maxRpm: 7200, shiftUpRpm: 6500, shiftDownRpm: 2500,

                handbrakeDecel: 4000, handbrakeGrip: 0.985, handbrakeDriftMult: 1.8
            },
            {

                modelUrl: 'neasun-slide.glb',
                stats: { speed: 82, accel: 88, handling: 85 },
                bodyW: 1.785, bodyH: 1.360, bodyL: 4.600,
                maxSpeedKmh: 250,
                mass: 1560,
                wheelRadius: 0.320,
                gearRatios: [3.827, 2.360, 1.685, 1.312, 1.000, 0.793],
                finalDrive: 3.545,
                drivetrainEfficiency: 0.88,
                torqueCurve: [
                    { rpm: 800, torque: 200 }, { rpm: 1500, torque: 300 }, { rpm: 2500, torque: 380 },
                    { rpm: 3500, torque: 400 }, { rpm: 4500, torque: 390 }, { rpm: 5500, torque: 350 },

                ],
                idleRpm: 850, redlineRpm: 7600, maxRpm: 7800, shiftUpRpm: 7000, shiftDownRpm: 2800,
                cd: 0.34, frontalArea: 1.98, rollingResistance: 0.015, airDensity: 1.225,
                handbrakeDecel: 4500, handbrakeGrip: 0.990, handbrakeDriftMult: 1.9,

            },
            {

                stats: { speed: 70, accel: 65, handling: 95 },
                bodyW: 2.2, bodyH: 0.5, bodyL: 4.4,
                maxSpeedKmh: 200, mass: 1300, wheelRadius: 0.31,
                gearRatios: [3.5, 2.2, 1.6, 1.2, 0.95, 0.8], finalDrive: 3.7,
                drivetrainEfficiency: 0.89,
                torqueCurve: [{ rpm: 800, torque: 180 }, { rpm: 3000, torque: 350 }, { rpm: 5000, torque: 380 }, { rpm: 6000, torque: 320 }, { rpm: 6800, torque: 0 }],
                idleRpm: 900, redlineRpm: 6800, maxRpm: 7000, shiftUpRpm: 6300, shiftDownRpm: 2600,
                cd: 0.34, frontalArea: 1.9, rollingResistance: 0.015, airDensity: 1.225,
                handbrakeDecel: 4000, handbrakeGrip: 0.985, handbrakeDriftMult: 2.0
            },
            {

                gearRatios: [3.1, 2.0, 1.5, 1.15, 0.9, 0.75], finalDrive: 3.4,
                drivetrainEfficiency: 0.91,
                torqueCurve: [{ rpm: 800, torque: 220 }, { rpm: 3000, torque: 420 }, { rpm: 5000, torque: 480 }, { rpm: 6000, torque: 450 }, { rpm: 7000, torque: 350 }, { rpm: 7500, torque: 0 }],
                idleRpm: 900, redlineRpm: 7500, maxRpm: 7800, shiftUpRpm: 7200, shiftDownRpm: 2800,

                handbrakeDecel: 4000, handbrakeGrip: 0.985, handbrakeDriftMult: 1.8
            }
        ];
        
        let selectedCarId = 'supra';
        
        const sharedWheelMat = new THREE.MeshStandardMaterial({ color: 0x0A0A0A, roughness: 0.9 });
        const sharedRimMat = new THREE.MeshStandardMaterial({ color: 0xC0C0C0, metalness: 0.95, roughness: 0.15 });
        const sharedGlassMat = new THREE.MeshStandardMaterial({ color: 0x111820, roughness: 0.05, metalness: 0.95, transparent: true, opacity: 0.85 });
        const sharedSpoilerMat = new THREE.MeshStandardMaterial({ color: 0x1A1A1A, roughness: 0.5, metalness: 0.8 });
        const sharedDarkMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
        const sharedHeadlightMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, emissive: 0xFFEEAA, emissiveIntensity: 1.2 });
        const sharedTaillightMat = new THREE.MeshStandardMaterial({ color: 0xFF0000, emissive: 0xFF0000, emissiveIntensity: 1.0 });
        
        const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 14); wheelGeo.rotateZ(Math.PI / 2);
        const rimGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.37, 6); rimGeo.rotateZ(Math.PI / 2);
        
        // ===== GLB =====
        const gltfLoader = new GLTFLoader();
        const glbCache = new Map();
        function loadGLB(url) {
            if (glbCache.has(url)) return glbCache.get(url);
            const p = new Promise((resolve, reject) => gltfLoader.load(url, g => resolve(g.scene), undefined, reject));
            glbCache.set(url, p);
            return p;
        }
        function normalizeGLB(root, targetLength = 4.6) {
            const wrapper = new THREE.Group();
            const inner = new THREE.Group(); wrapper.add(inner); inner.add(root);
            const box = new THREE.Box3().setFromObject(inner);
            const size = new THREE.Vector3(); box.getSize(size);
            const center = new THREE.Vector3(); box.getCenter(center);
            const maxHorizontal = Math.max(size.x, size.z);
            const scale = targetLength / Math.max(maxHorizontal, 0.001);
            inner.scale.setScalar(scale);
            inner.position.x = -center.x * scale;
            inner.position.z = -center.z * scale;
            inner.position.y = -box.min.y * scale;
            inner.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
            return wrapper;
        }
        
        async function buildCarModel(def) {

                : 0;
            carState.driftAngle = driftAngleDeg;

            const nowDrifting = (driftAngleDeg > 18 && speedVec > 8) || (carState.handbrake && speedVec > 4);

            if (nowDrifting) {
                if (!carState.isDrifting) carState.driftTimer = 0;
                carState.isDrifting = true;
                carState.driftTimer += dt;
                const gain = driftAngleDeg * speedVec * dt * 0.5;
                carState.pendingDriftScore += gain;
                carState.driftScore += gain;
                carState.driftCombo = Math.min(1 + carState.driftTimer * 0.5, 5);
            } else {
                if (carState.isDrifting) {
                    if (carState.driftTimer > 0.8) {
                        carState.driftScore += carState.pendingDriftScore * (carState.driftCombo - 1);
                    }
                    carState.pendingDriftScore = 0;
                    carState.driftTimer = 0;
                    carState.driftCombo = 1;
                }
                carState.isDrifting = false;
            }

            // ===== СЛЕДЫ ШИН =====
            const shouldDrawSkid = carState.isDrifting || (carState.handbrake && speedVec > 3);
            if (shouldDrawSkid) {
                const rearL_local = { x: -0.9, z: -1.4 };
                const rearR_local = { x:  0.9, z: -1.4 };
                const rearL_world = {
                    x: carState.posX + newCos * rearL_local.x + newSin * rearL_local.z,
                    z: carState.posZ - newSin * rearL_local.x + newCos * rearL_local.z
                };
                const rearR_world = {
                    x: carState.posX + newCos * rearR_local.x + newSin * rearR_local.z,
                    z: carState.posZ - newSin * rearR_local.x + newCos * rearR_local.z
                };
                const marks = [rearL_world, rearR_world];
                marks.forEach((pos, i) => {
                    if (lastSkidPositions[i]) {
                        const dx = pos.x - lastSkidPositions[i].x;
                        const dz = pos.z - lastSkidPositions[i].z;
                        if (Math.hypot(dx, dz) > 0.25) {
                            addSkidMark((pos.x + lastSkidPositions[i].x) / 2,
                                        (pos.z + lastSkidPositions[i].z) / 2,
                                        Math.atan2(dx, dz));
                            lastSkidPositions[i] = { x: pos.x, z: pos.z };
                        }
                    } else {
                        lastSkidPositions[i] = { x: pos.x, z: pos.z };
                    }
                });
            } else {
                lastSkidPositions[0] = null;
                lastSkidPositions[1] = null;
            }

            // ===== ВИЗУАЛ =====
            car.position.set(carState.posX, 0, carState.posZ);
            car.rotation.y = carState.angle;
            const rollTarget  = -carState.angularVelocity * 0.06 + (carState.isDrifting ? -Math.sign(sideNew) * 0.04 : 0);
            const pitchTarget = (carState.throttle - carState.brake) * 0.012;
            car.rotation.z = THREE.MathUtils.lerp(car.rotation.z, rollTarget, dt * 6);
            car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, pitchTarget, dt * 6);

            carState.wheelSpin += vForward * dt / carState.wheelRadius;
            const wheels = car.userData.wheels || [];
            for (let i = 0; i < wheels.length; i++) wheels[i].rotation.x = carState.wheelSpin;
            const fWheels = car.userData.frontWheels || [];
            for (let i = 0; i < fWheels.length; i++) fWheels[i].rotation.y = carState.steeringAngle;
        }
        
        // ===== КАМЕРА =====
        const camTargetVec = new THREE.Vector3();
        function updateCamera() {
            if (!car) return;
            const dist = 10, height = 4.5;
            const sinA = Math.sin(carState.angle), cosA = Math.cos(carState.angle);
            camera.position.set(carState.posX - sinA * dist, height, carState.posZ - cosA * dist);
            camTargetVec.set(carState.posX + sinA * 3, 1.5, carState.posZ + cosA * 3);
            camera.lookAt(camTargetVec);
        }
        
        // ===== HUD =====
        const speedValueEl = document.getElementById('speed-value');
        const rpmValueEl = document.getElementById('rpm-value');
        const gearValueEl = document.getElementById('gear-value');
        const scoreValueEl = document.getElementById('score-value');
        const comboEl = document.getElementById('drift-combo');
        let hudTimer = 0;
        function updateHUD(dt) {
            if (!car) return;
            hudTimer += dt; if (hudTimer < 0.05) return; hudTimer = 0;
            const speed = Math.sqrt(carState.velocityX ** 2 + carState.velocityZ ** 2);
            const kmh = speed * 3.6;
            speedValueEl.textContent = Math.round(kmh);
            speedValueEl.style.color = kmh > 180 ? '#FF1744' : kmh > 120 ? '#FFC107' : '#4CAF50';
            rpmValueEl.textContent = Math.round(carState.rpm);
            gearValueEl.textContent = carState.gear === 0 ? 'N' : carState.gear === -1 ? 'R' : carState.gear;
            scoreValueEl.textContent = Math.round(carState.driftScore);
            if (carState.driftCombo > 1.05) {
                comboEl.textContent = 'x' + carState.driftCombo.toFixed(1) + '  +' + Math.round(carState.pendingDriftScore);
                comboEl.classList.add('active');
            } else {
                comboEl.classList.remove('active');
            }
        }
        
        startBtn.addEventListener('click', async () => {
            garageEl.classList.add('hidden');
            await spawnPlayerCar(selectedCarId);
            clearSkidMarks();
            lastSkidPositions[0] = null; lastSkidPositions[1] = null;
        });
        garageBtn.addEventListener('click', () => garageEl.classList.remove('hidden'));
        
        // ===== ФОНАРИ =====
        {
            const lampPositions = [];
            roadPositions.forEach(z => { for (let x = -380; x <= 380; x += 60) lampPositions.push({ x, z: z + roadHalf + 2 }); });
            const poleGeo2 = new THREE.CylinderGeometry(0.15, 0.2, 8, 6);
            const poleMat2 = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7 });
            const poleInst = new THREE.InstancedMesh(poleGeo2, poleMat2, lampPositions.length);
            const lampGeo2 = new THREE.SphereGeometry(0.4, 8, 8);
            const lampMat2 = new THREE.MeshStandardMaterial({ color: 0xFFFFAA, emissive: 0xFFFF88, emissiveIntensity: 1.5 });
            const lampInst = new THREE.InstancedMesh(lampGeo2, lampMat2, lampPositions.length);
            const mat = new THREE.Matrix4();
            lampPositions.forEach((p, i) => {
                mat.makeTranslation(p.x, 4, p.z); poleInst.setMatrixAt(i, mat);
                mat.makeTranslation(p.x, 8, p.z); lampInst.setMatrixAt(i, mat);
            });
            poleInst.instanceMatrix.needsUpdate = true; lampInst.instanceMatrix.needsUpdate = true;
            scene.add(poleInst); scene.add(lampInst);
        }
        
        const clock = new THREE.Clock();
        (async () => {
            await buildGarageUI();
            await spawnPlayerCar(selectedCarId);
            for (let i = 0; i < NPC_COUNT; i++) await spawnNPC();
        })();
        
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const garageOpen = !garageEl.classList.contains('hidden');
            if (!garageOpen && car) {
                updatePhysics(dt);
                updateCamera();
                updateHUD(dt);
            } else {
                const t = Date.now() * 0.0003;
                camera.position.set(carState.posX + Math.sin(t) * 15, 7, carState.posZ + Math.cos(t) * 15);
                camera.lookAt(carState.posX, 1, carState.posZ);
            }
            updateNPCs(dt);
            updateTrafficLights(dt);
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        camera.position.set(-100, 5, -10);
        animate();
    </script>
</body>
</html>
